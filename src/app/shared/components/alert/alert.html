<div class="fixed top-5 right-5 flex flex-col gap-3 z-50 max-w-md">
  @for (alert of alerts(); track alert.id) {
    <div 
      [class]="getClass(alert.type)" 
      class="px-5 py-4 rounded-xl shadow-2xl flex items-start gap-3 backdrop-blur-sm border-2 animate-slideIn transform transition-all duration-300 hover:scale-105">
      
      <!-- Icono según el tipo -->
      <div class="flex-shrink-0 mt-0.5">
        @switch (alert.type) {
          @case ('success') {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          }
          @case ('error') {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          }
          @case ('info') {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          }
        }
      </div>

      <!-- Mensaje -->
      <div class="flex-1 min-w-0">
        <p class="font-semibold text-sm leading-relaxed break-words">{{ alert.message }}</p>
      </div>

      <!-- Botón cerrar -->
      <button 
        (click)="remove(alert.id)" 
        class="flex-shrink-0 ml-2 w-6 h-6 rounded-full hover:bg-black hover:bg-opacity-10 transition-all flex items-center justify-center group"
        aria-label="Cerrar alerta">
        <svg class="w-4 h-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  }
</div>
