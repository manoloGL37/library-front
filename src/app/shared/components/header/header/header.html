<header class="fixed top-0 left-0 right-0 bg-white border-b border-gray-300 z-50 shadow-sm">
      <div class="max-w-7xl mx-auto py-3 flex items-center justify-between">
        
        <!-- Logo/Nombre de la biblioteca -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-lg shadow-md">
            B
          </div>
          <h1 class="text-xl font-bold text-gray-800">Biblioteca Digital</h1>
        </div>

        <!-- Navegación y acciones -->
        <div class="flex items-center gap-4">
          
          <!-- Carrito de préstamos -->
          <button 
            (click)="onCartClick()"
            class="relative flex items-center gap-2 px-4 py-2 hover:bg-gray-100 rounded-lg transition-all">
            <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
            </svg>
            <span class="text-gray-700 font-medium">Préstamos</span>
            
            <!-- Badge con cantidad -->
            @if (cartCount() > 0) {
              <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center shadow-md">
                {{ cartCount() }}
              </span>
            }
          </button>

          <!-- Separador vertical -->
          <div class="h-8 w-px bg-gray-300"></div>

          <!-- Usuario autenticado -->
          @if (isAuthenticated()) {
            <div class="flex items-center gap-3">
              <!-- Avatar y saludo -->
              <div class="flex items-center gap-2 px-3 py-1.5 bg-blue-50 rounded-lg border border-blue-200">
                <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white font-semibold text-sm">
                  {{ getUserInitial() }}
                </div>
                <span class="text-sm font-medium text-gray-700">
                  Hola, <span class="text-blue-600">{{ userName() }}</span>
                </span>
              </div>
              
              <!-- Botón logout -->
              <button 
                (click)="onLogout()"
                class="px-4 py-2 bg-red-500 text-white font-medium rounded-lg hover:bg-red-600 transition-all shadow-sm hover:shadow-md">
                Cerrar sesión
              </button>
            </div>
          }
        </div>
      </div>
    </header>

    <!-- Espaciador para compensar el header fijo -->
    <div class="h-16"></div>
