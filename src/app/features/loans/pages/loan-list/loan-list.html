<div class="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-red-50 p-6">
  <div class="max-w-5xl mx-auto">
    
    <!-- Encabezado -->
    <div class="mb-8">
      <h1 class="text-4xl font-bold text-gray-800 mb-2">Mis Préstamos</h1>
      <p class="text-gray-600">Gestiona tus libros prestados y fechas de devolución</p>
    </div>

    <!-- Estadísticas rápidas -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
      <div class="bg-white rounded-xl p-4 shadow-md">
        <div class="flex items-center gap-3">
          <div class="bg-blue-100 p-3 rounded-lg">
            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
            </svg>
          </div>
          <div>
            <p class="text-2xl font-bold text-gray-800">{{ loans().length }}</p>
            <p class="text-sm text-gray-600">Préstamos activos</p>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-xl p-4 shadow-md">
        <div class="flex items-center gap-3">
          <div class="bg-green-100 p-3 rounded-lg">
            <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </div>
          <div>
            <!-- <p class="text-2xl font-bold text-gray-800">{{ getCompletedLoans() }}</p> -->
            <p class="text-sm text-gray-600">Libros devueltos</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Lista de préstamos -->
    <div class="space-y-4">
      
      @for (loan of loans(); track loan.id) {
        <app-loan-list-card [loan]="loan" (returnBookId)="onReturnBook($event)">
        </app-loan-list-card>
      }

    </div>

    <!-- Mensaje cuando no hay préstamos -->
    @if (loans().length === 0) {
      <div class="bg-white rounded-xl shadow-md p-12 text-center">
        <svg class="mx-auto h-24 w-24 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
        </svg>
        <h3 class="text-xl font-semibold text-gray-700 mb-2">No tienes préstamos activos</h3>
        <p class="text-gray-500 mb-6">Explora nuestra biblioteca y pide tu primer libro prestado</p>
        <button
          type="button"
          class="px-6 py-3 bg-gradient-to-r from-amber-600 to-orange-700 text-white rounded-lg font-semibold hover:from-amber-700 hover:to-orange-800 transition-all"
        >
          Explorar biblioteca
        </button>
      </div>
    }

  </div>
</div>
