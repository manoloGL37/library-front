
<div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fadeIn">
  <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl transform animate-slideUp">
    
    <!-- Header con icono -->
    <div class="bg-gradient-to-r from-amber-600 to-orange-700 rounded-t-2xl p-6 text-white">
      <div class="flex items-center gap-3">
        <div class="bg-white/20 rounded-full p-3">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
          </svg>
        </div>
        <div>
          <h2 class="text-2xl font-bold">Confirmar préstamo</h2>
          <p class="text-white/80 text-sm">Selecciona la duración</p>
        </div>
      </div>
    </div>

    <!-- Contenido -->
    <div class="p-6 space-y-6">
      
      <!-- Información del libro -->
      <div class="bg-amber-50 border border-amber-200 rounded-lg p-4">
        <p class="text-sm text-gray-600 mb-1">Vas a solicitar el préstamo de:</p>
        <p class="text-lg font-bold text-gray-800">{{ bookTitle }}</p>
      </div>

      <!-- Selector de duración -->
      <div class="space-y-3">
        <label class="block text-sm font-semibold text-gray-700">
          <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          Duración del préstamo
        </label>

        <div class="relative">
          <select
            class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 pr-10 appearance-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none transition-all cursor-pointer bg-white hover:border-orange-400"
            [value]="selectedDays()"
            (change)="selectedDays.set($any($event.target).value)">
            <option [value]="14">14 días (2 semanas)</option>
            <option [value]="30">30 días (1 mes)</option>
            <option [value]="60">60 días (2 meses)</option>
          </select>
          
          <!-- Icono de dropdown -->
          <div class="absolute right-3 top-1/2 transform -translate-y-1/2 pointer-events-none">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </div>
        </div>

        <!-- Información adicional -->
        <!-- <p class="text-xs text-gray-500 flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          Podrás renovar el préstamo antes de que expire
        </p> -->
      </div>

    </div>

    <!-- Footer con botones -->
    <div class="bg-gray-50 rounded-b-2xl px-6 py-4 flex justify-end gap-3">
      <button
        type="button"
        class="px-6 py-2.5 rounded-lg bg-white border-2 border-gray-300 text-gray-700 font-medium hover:bg-gray-50 hover:border-gray-400 transition-all"
        (click)="cancel.emit()">
        Cancelar
      </button>

      <button
        type="button"
        class="px-6 py-2.5 rounded-lg bg-gradient-to-r from-amber-600 to-orange-700 text-white font-semibold hover:from-amber-700 hover:to-orange-800 transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-0.5"
        (click)="confirmLoan()">
        Confirmar préstamo
      </button>
    </div>

  </div>
</div>
