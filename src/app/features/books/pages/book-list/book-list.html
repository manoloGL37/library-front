<div class="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-red-50 p-6">
  <div class="max-w-7xl mx-auto">

    <!-- Encabezado -->
    <div class="mb-8">
      <p class="text-gray-600 text-lg font-bold">Explora nuestra colección de libros</p>
    </div>

    <!-- Barra de búsqueda y paginación -->
    <div class="bg-white rounded-2xl shadow-lg p-6 mb-8 border border-gray-100">
      <div class="flex flex-col md:flex-row items-center justify-between gap-4">

        <!-- Búsqueda -->
        <div class="w-full md:flex-1 relative">
          <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5" fill="none"
            stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <input type="text" placeholder="Buscar por título, autor o ISBN..." [(ngModel)]="searchTerm"
            (input)="loadBooks()"
            class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-transparent outline-none transition-all bg-gray-50 focus:bg-white" />
        </div>

        <!-- Paginación -->
        <div class="flex items-center gap-3">
          <button (click)="previousPage()" [disabled]="page === 0"
            class="px-4 py-2 bg-gradient-to-r from-amber-600 to-orange-700 text-white rounded-lg font-medium hover:from-amber-700 hover:to-orange-800 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:from-gray-400 disabled:to-gray-500 shadow-md hover:shadow-lg transform hover:-translate-y-0.5 disabled:transform-none">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
          </button>

          <div class="px-4 py-2 bg-gray-100 rounded-lg">
            <span class="text-gray-700 font-semibold">{{ page + 1 }}</span>
            <span class="text-gray-400 mx-1">/</span>
            <span class="text-gray-600">{{ totalPages }}</span>
          </div>

          <button (click)="nextPage()" [disabled]="page + 1 >= totalPages"
            class="px-4 py-2 bg-gradient-to-r from-amber-600 to-orange-700 text-white rounded-lg font-medium hover:from-amber-700 hover:to-orange-800 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:from-gray-400 disabled:to-gray-500 shadow-md hover:shadow-lg transform hover:-translate-y-0.5 disabled:transform-none">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
          </button>
        </div>

      </div>
    </div>

    <!-- Grid de libros -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">

      @for (book of books; track book.id) {
      <app-book-card [book]="book" (viewDetails)="goToDetails($event)">
      </app-book-card>
      }
    </div>

    
    <!-- Mensaje cuando no hay libros -->
    @if (books.length === 0) {
    <div class="text-center py-16">
      <svg class="mx-auto h-24 w-24 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
        </path>
      </svg>
      <h3 class="text-xl font-semibold text-gray-700 mb-2">No hay libros disponibles</h3>
      <p class="text-gray-500">La biblioteca está vacía por el momento</p>
    </div>
    }

    <div class="flex justify-center mt-8">
      <div class="bg-white rounded-2xl shadow-lg p-4 border border-gray-100">
        <div class="flex items-center gap-3">

          <!-- Botón anterior -->
          <button (click)="previousPage()" [disabled]="page === 0"
            class="px-4 py-2 bg-gradient-to-r from-amber-600 to-orange-700 text-white rounded-lg font-medium hover:from-amber-700 hover:to-orange-800 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:from-gray-400 disabled:to-gray-500 shadow-md hover:shadow-lg transform hover:-translate-y-0.5 disabled:transform-none">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
          </button>

          <!-- Indicador de página -->
          <div class="px-6 py-2 bg-gray-100 rounded-lg">
            <span class="text-gray-700 font-semibold">{{ page + 1 }}</span>
            <span class="text-gray-400 mx-1">/</span>
            <span class="text-gray-600">{{ totalPages }}</span>
          </div>

          <!-- Botón siguiente -->
          <button (click)="nextPage()" [disabled]="page + 1 >= totalPages"
            class="px-4 py-2 bg-gradient-to-r from-amber-600 to-orange-700 text-white rounded-lg font-medium hover:from-amber-700 hover:to-orange-800 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:from-gray-400 disabled:to-gray-500 shadow-md hover:shadow-lg transform hover:-translate-y-0.5 disabled:transform-none">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
          </button>

        </div>
      </div>
    </div>

  </div>
</div>

<app-chat-widget></app-chat-widget>
