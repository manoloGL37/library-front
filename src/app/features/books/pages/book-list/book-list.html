<div class="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-red-50 p-6">
  <div class="max-w-7xl mx-auto">
    
    <!-- Encabezado -->
    <div class="mb-8">
      <h1 class="text-4xl font-bold text-gray-800 mb-2">Biblioteca Digital</h1>
      <p class="text-gray-600">Explora nuestra colección de libros</p>
    </div>

    <!-- Grid de libros -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      
      @for (book of books; track book.id) {
        <div class="group bg-white rounded-xl shadow-md hover:shadow-2xl transition-all duration-300 overflow-hidden cursor-pointer transform hover:-translate-y-2">
          
          <!-- Imagen de portada -->
          <div class="relative h-80 overflow-hidden bg-gray-200">
            <img 
              [src]="book.coverUrl" 
              [alt]="book.title"
              class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110"
            />
            
            <!-- Overlay que aparece al hacer hover -->
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
              <div class="text-white transform translate-y-4 group-hover:translate-y-0 transition-transform duration-300">
                <p class="text-sm font-medium mb-1">{{ book.author }}</p>
                <p class="text-xs text-gray-300">Publicado en {{ book.year }}</p>
              </div>
            </div>

            <!-- Badge del año (esquina superior derecha) -->
            <div class="absolute top-3 right-3 bg-orange-600 text-white px-3 py-1 rounded-full text-xs font-semibold shadow-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300">
              {{ book.year }}
            </div>
          </div>

          <!-- Información del libro -->
          <div class="p-4">
            <h3 class="text-lg font-bold text-gray-800 mb-1 line-clamp-2 group-hover:text-orange-600 transition-colors">
              {{ book.title }}
            </h3>
            <p class="text-sm text-gray-600 mb-2">{{ book.author }}</p>
            
            <!-- Botón de acción -->
            <button 
              type="button"
              class="w-full mt-2 bg-gradient-to-r from-amber-600 to-orange-700 text-white py-2 rounded-lg text-sm font-semibold opacity-0 group-hover:opacity-100 transition-opacity duration-300 hover:from-amber-700 hover:to-orange-800 transform translate-y-2 group-hover:translate-y-0"
            >
              Ver detalles
            </button>
          </div>

        </div>
      }

    </div>

    <!-- Mensaje cuando no hay libros -->
    @if (books.length === 0) {
      <div class="text-center py-16">
        <svg class="mx-auto h-24 w-24 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
        </svg>
        <h3 class="text-xl font-semibold text-gray-700 mb-2">No hay libros disponibles</h3>
        <p class="text-gray-500">La biblioteca está vacía por el momento</p>
      </div>
    }

  </div>
</div>
