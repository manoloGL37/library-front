<div class="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-red-50 p-6">
  <div class="max-w-7xl mx-auto">
    
    <!-- Encabezado -->
    <div class="mb-8">
      <h1 class="text-4xl font-bold text-gray-800 mb-2">Biblioteca Digital</h1>
      <p class="text-gray-600">Explora nuestra colección de libros</p>
    </div>

    <!-- Grid de libros -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    
      @for (book of books; track book.id) {
      <app-book-card [book]="book" (viewDetails)="goToDetails($event)">
      </app-book-card>
      }
    </div>

    <!-- Mensaje cuando no hay libros -->
    @if (books.length === 0) {
      <div class="text-center py-16">
        <svg class="mx-auto h-24 w-24 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
        </svg>
        <h3 class="text-xl font-semibold text-gray-700 mb-2">No hay libros disponibles</h3>
        <p class="text-gray-500">La biblioteca está vacía por el momento</p>
      </div>
    }

  </div>
</div>
